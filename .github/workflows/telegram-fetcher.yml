name: 📡 آرشیو خودکار کانال‌های تلگرام

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: دریافت مخزن
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: نصب ابزارها
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          pip install playwright jdatetime requests beautifulsoup4
          playwright install chromium

      - name: اجرای اسکریپت آرشیو
        run: |
          python3 - << 'EOF'
          import os, json, time, re, hashlib, requests
          from bs4 import BeautifulSoup
          from playwright.sync_api import sync_playwright
          import jdatetime
          from datetime import datetime, timezone

          CHANNELS_FILE = "telegram/channels.json"
          OUTPUT_FILE = "telegram.md"
          CONTENT_DIR = "telegram/content"
          LAST_IDS_FILE = "telegram/last_ids.json"

          os.makedirs(CONTENT_DIR, exist_ok=True)

          def load_json(path, default=None):
              if os.path.exists(path):
                  with open(path, 'r') as f:
                      return json.load(f)
              return default if default is not None else {}

          def save_json(path, data):
              with open(path, 'w') as f:
                  json.dump(data, f, indent=2, ensure_ascii=False)

          def download_media(url, channel, msg_id):
              if not url or 'css' in url:
                  return None
              try:
                  resp = requests.get(url, timeout=30, headers={'User-Agent': 'Mozilla/5.0'})
                  if resp.status_code == 200:
                      ext = url.split('.')[-1].split('?')[0][:5]
                      if ext not in ['jpg', 'jpeg', 'png', 'gif', 'webp', 'mp4', 'pdf']:
                          ext = 'jpg'
                      filename = f"{channel}_{msg_id}_{hashlib.md5(url.encode()).hexdigest()[:8]}.{ext}"
                      filepath = os.path.join(CONTENT_DIR, filename)
                      with open(filepath, 'wb') as f:
                          f.write(resp.content)
                      return f"content/{filename}"
              except:
                  pass
              return None

          def convert_time(timestamp_str):
              try:
                  if 'T' in timestamp_str:
                      dt = datetime.fromisoformat(timestamp_str.replace('Z', '+00:00'))
                  else:
                      dt = datetime.strptime(timestamp_str, "%d %b %Y at %H:%M")
                  jd = jdatetime.datetime.fromgregorian(datetime=dt)
                  return f"{jd.year}/{jd.month}/{jd.day} - {jd.hour:02d}:{jd.minute:02d}"
              except:
                  return timestamp_str

          with open(CHANNELS_FILE, 'r') as f:
              channels = json.load(f)

          last_ids = load_json(LAST_IDS_FILE, {})
          all_messages = []

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context(
                  user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
              )
              page = context.new_page()

              for channel in channels:
                  print(f"\n📡 پردازش کانال: {channel}")
                  url = f"https://t.me/s/{channel}"
                  page.goto(url, timeout=60000)
                  time.sleep(3)
                  
                  last_seen = last_ids.get(channel, 0)
                  new_count = 0
                  
                  for _ in range(5):
                      page.mouse.wheel(0, 2000)
                      time.sleep(1)
                  
                  messages = page.query_selector_all('.tgme_widget_message')
                  
                  for msg in messages:
                      try:
                          msg_id_elem = msg.query_selector('.tgme_widget_message_date time')
                          msg_id = int(msg_id_elem.get_attribute('datetime').replace('-', '').replace('T', '').replace(':', '')[:14]) if msg_id_elem else 0
                          
                          if msg_id <= last_seen:
                              continue
                              
                          text_elem = msg.query_selector('.tgme_widget_message_text')
                          text = text_elem.inner_text() if text_elem else ""
                          
                          time_elem = msg.query_selector('.time')
                          msg_time = time_elem.get_attribute('datetime') if time_elem else ""
                          
                          images = []
                          for img in msg.query_selector_all('img'):
                              src = img.get_attribute('src')
                              if src and 'emoji' not in src:
                                  downloaded = download_media(src, channel, msg_id)
                                  if downloaded:
                                      images.append(downloaded)
                          
                          videos = []
                          for video in msg.query_selector_all('video'):
                              src = video.get_attribute('src')
                              if src:
                                  downloaded = download_media(src, channel, msg_id)
                                  if downloaded:
                                      videos.append(downloaded)
                          
                          all_messages.append({
                              'channel': channel,
                              'id': msg_id,
                              'time': msg_time,
                              'text': text,
                              'images': images,
                              'videos': videos
                          })
                          new_count += 1
                          
                          if msg_id > last_ids.get(channel, 0):
                              last_ids[channel] = msg_id
                      except:
                          continue
                  
                  print(f"   ✅ {new_count} پیام جدید")
                  save_json(LAST_IDS_FILE, last_ids)
              
              browser.close()

          all_messages.sort(key=lambda x: x['id'], reverse=True)

          with open(OUTPUT_FILE, 'w', encoding='utf-8') as f:
              f.write("# 📡 آرشیو خودکار کانال‌های تلگرام\n\n")
              f.write(f"آخرین به‌روزرسانی: {datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M:%S')} UTC\n\n")
              
              for msg in all_messages:
                  f.write(f"## 📌 {msg['channel']}\n")
                  f.write(f"**زمان:** {convert_time(msg['time'])} | **شناسه:** {msg['id']}\n\n")
                  
                  if msg['text']:
                      f.write(f"{msg['text']}\n\n")
                  
                  for img in msg['images']:
                      f.write(f"![تصویر]({img})\n\n")
                  
                  for vid in msg['videos']:
                      f.write(f"▶️ [ویدیو]({vid})\n\n")
                  
                  f.write("---\n\n")

          print(f"\n✅ آرشیو ذخیره شد: {OUTPUT_FILE}")
          EOF

      - name: Commit و Push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add telegram.md telegram/content/ telegram/last_ids.json || true
          git diff --cached --quiet || git commit -m "به‌روزرسانی خودکار آرشیو تلگرام [skip ci]"
          git push origin main || git push origin master
